# ODS MVP development/full stack
# ES only:  docker compose -f docker/docker-compose.dev.yml up -d
# Full:     docker compose -f docker/docker-compose.dev.yml --profile full up --build -d
#
# Parsers come from the backend image (Dockerfile: npm ci / dotnet / mvn). The host parsers/
# directory is not mounted; after cloning, --build is sufficient.
#
# Documentation:
#   specs/002-domain-model/quickstart.md
#   specs/003-portal-mvp/contracts/docker-integration.md

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DATA_ROOT: /data/ods
      LOCAL_REPOS_MOUNT: /repos
      # Absolute host path of the volume source — enables pasting Mac/Linux paths in Import.
      LOCAL_REPOS_HOST_PATH: ${LOCAL_REPOS_HOST_PATH:-}
      LOCAL_PATH_MAP: ${LOCAL_PATH_MAP:-}
      PARSERS_ROOT: /app/parsers
      DOCS_PROMPT_TEMPLATE: /app/prompts/docs-agent-prompt.md
      PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      ANALYSIS_PARSER_TIMEOUT_MS: 600000
      PORT: 3000
    volumes:
      - ods-data:/data/ods
      - ${LOCAL_REPOS_HOST_PATH:-./fixtures/repos}:/repos:ro
      # Optional second root (set LOCAL_REPOS_EXTRA_HOST_PATH + LOCAL_PATH_MAP).
      - ${LOCAL_REPOS_EXTRA_HOST_PATH:-./fixtures/repos}:/repos-extra:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    profiles:
      - full

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - full

volumes:
  es-data:
  ods-data:
