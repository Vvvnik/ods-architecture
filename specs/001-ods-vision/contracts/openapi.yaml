openapi: 3.1.0
info:
  title: ODS Portal MVP API
  version: 0.1.0
  description: |
    HTTP API MVP портала ODS (001-ods-vision).
    Без аутентификации в MVP: все операции, включая регистрацию проекта
    (`POST /projects`) и sync, доступны без `Authorization` (доверенная сеть пилота).
    «Admin» в summary — UX-метка экрана, не RBAC. Post-MVP — см. FR-018.

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: projects
  - name: files
  - name: elements
  - name: documentation
  - name: links

paths:
  /projects:
    get:
      tags: [projects]
      summary: Список проектов
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      tags: [projects]
      summary: Зарегистрировать проект (экран регистрации; без auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{projectId}:
    get:
      tags: [projects]
      summary: Получить проект
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{projectId}/sync:
    post:
      tags: [projects]
      summary: Запустить sync рабочей копии и перестроить дерево
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "202":
          description: Sync accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncJob"

  /projects/{projectId}/tree:
    get:
      tags: [projects]
      summary: Дерево элементов (lazy — children по parentPath)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: parentPath
          in: query
          schema:
            type: string
            default: ""
        - name: depth
          in: query
          schema:
            type: integer
            default: 1
        - name: status
          in: query
          description: Фильтр по статусу элемента (FR-005, T060); необязательный
          schema:
            $ref: "#/components/schemas/ElementStatus"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectElement"

  /projects/{projectId}/files:
    post:
      tags: [files]
      summary: Создать новый текстовый файл (FR-003, T056)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContent"
        "409":
          description: Файл по этому пути уже существует
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
    get:
      tags: [files]
      summary: Прочитать текстовый файл
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContent"
    put:
      tags: [files]
      summary: Сохранить файл (с проверкой конфликта)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: path
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, baseContentHash]
              properties:
                content:
                  type: string
                baseContentHash:
                  type: string
                  description: hash при открытии (FR-011)
                force:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Saved
        "409":
          description: Conflict — файл изменился на диске
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"

  /projects/{projectId}/elements/{elementId}/status:
    patch:
      tags: [elements]
      summary: Изменить статус элемента
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: elementId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/ElementStatus"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectElement"

  /projects/{projectId}/documentation:
    get:
      tags: [documentation]
      summary: Список документов проекта (FR-009)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectElement"

  /projects/{projectId}/links:
    get:
      tags: [links]
      summary: Связи документ ↔ код
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentLink"
    post:
      tags: [links]
      summary: Создать связь (FR-010)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [codeElementId, documentElementId]
              properties:
                codeElementId:
                  type: string
                  format: uuid
                documentElementId:
                  type: string
                  format: uuid
                note:
                  type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentLink"

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ElementStatus:
      type: string
      enum: [auto_discovered, needed, not_needed, found, unused]

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sourceType:
          type: string
          enum: [local, git]
        sourceUri:
          type: string
        lastSyncAt:
          type: string
          format: date-time
        lastSyncStatus:
          type: string

    CreateProjectRequest:
      type: object
      required: [name, sourceType, sourceUri]
      properties:
        name:
          type: string
        sourceType:
          type: string
          enum: [local, git]
        sourceUri:
          type: string

    CreateFileRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Относительный путь нового файла в рабочей копии
        content:
          type: string
          default: ""
          description: Начальное содержимое (по умолчанию пустая строка)

    ProjectElement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
        kind:
          type: string
          enum: [file, directory]
        status:
          $ref: "#/components/schemas/ElementStatus"
        isDocument:
          type: boolean
        hasLinkedDocument:
          type: boolean

    FileContent:
      type: object
      properties:
        path:
          type: string
        content:
          type: string
        contentHash:
          type: string
        encoding:
          type: string

    SyncJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        startedAt:
          type: string
          format: date-time

    DocumentLink:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codeElementId:
          type: string
          format: uuid
        documentElementId:
          type: string
          format: uuid
        codePath:
          type: string
        documentPath:
          type: string

    ConflictError:
      type: object
      properties:
        code:
          type: string
          example: FILE_CONFLICT
        message:
          type: string
        currentContentHash:
          type: string
