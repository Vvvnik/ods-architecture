openapi: 3.0.3
info:
  title: ODS Backend API — slice view count, code-layer (012)
  description: |
    Extension `GET .../graph/view` from `011-ods-graph-viewer`.
    Base contract: `../011-ods-graph-viewer/contracts/openapi-graph-view.yaml`.
    This file fixes **Delta** for code-drill; implement MUST be
    backward compatible with calls `layer` (system-behavior `011`).
  version: 1.1.0

servers:
  - url: http://localhost:3000/api/v1
    description: Local development

paths:
  /projects/{projectId}/graph/view:
    get:
      summary: Circuit slice (system or code; focus + external)
      operationId: getGraphView
      description: |
        Without `layer` or `layer=system` — behavior 011.
        `layer=code` when focus=service — affiliated code roots + externals.
        `focus`=code-node — slice around code (children + externals ribs).
        `resolve_from` on code → focus on code (`resolve_status=exact_code`)
        or fallback 011.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: analysis_run_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: focus
          in: query
          required: false
          schema:
            type: string
          description: id Focus; omit/empty = System
        - name: layer
          in: query
          required: false
          schema:
            type: string
            enum: [system, code]
            default: system
          description: |
            The slice layer. For focus=code-node server MAY ignore and
            build code-slice.
        - name: resolve_from
          in: query
          required: false
          schema:
            type: string
          description: |
            Id node from "Graph Analysis". Code → exact_code focus; otherwise R5 011.
        - name: max_nodes
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
        - name: max_edges
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        '200':
          description: Cut (including empty code when no_related_code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphViewSlice'
        '404':
          description: Graph / project / focus not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
          description: Russian text for UI

    GraphViewNode:
      type: object
      required: [id, kind, name, role]
      properties:
        id:
          type: string
        kind:
          type: string
        name:
          type: string
        qualified_name:
          type: string
        path:
          type: string
        parent_id:
          type: string
          nullable: true
        language:
          type: string
        metadata:
          type: object
          additionalProperties: true
        role:
          type: string
          enum: [focus, inside, external]
        stub:
          type: boolean

    GraphViewEdge:
      type: object
      required: [id, from, to, type]
      properties:
        id:
          type: string
        from:
          type: string
        to:
          type: string
        type:
          type: string
        metadata:
          type: object
          additionalProperties: true

    GraphViewSlice:
      type: object
      required:
        - project_id
        - analysis_run_id
        - nodes
        - edges
        - truncated
        - limits
        - counts
        - layer
      properties:
        project_id:
          type: string
          format: uuid
        analysis_run_id:
          type: string
          format: uuid
        focus_id:
          type: string
          nullable: true
        focus_kind:
          type: string
          nullable: true
        layer:
          type: string
          enum: [system, code]
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphViewNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphViewEdge'
        truncated:
          type: boolean
        limits:
          type: object
          required: [max_nodes, max_edges]
          properties:
            max_nodes:
              type: integer
            max_edges:
              type: integer
        counts:
          type: object
          properties:
            nodes:
              type: integer
            edges:
              type: integer
            omitted_nodes:
              type: integer
            omitted_edges:
              type: integer
        resolve_status:
          type: string
          enum:
            - exact
            - exact_code
            - resolved_service
            - system_fallback
          nullable: true
        empty_reason:
          type: string
          enum:
            - no_graph
            - no_system_participants
            - no_related_code
          nullable: true
        affiliation:
          type: object
          nullable: true
          properties:
            mode:
              type: string
              enum: [explicit, view_only, none]
            service_id:
              type: string
              nullable: true
