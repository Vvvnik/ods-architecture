openapi: 3.0.3
info:
  title: ODS Backend API  MVP data model
  description: |
    The canonical REST API backend (`002-domain-model`).
    User: `specs/003-portal-mvp` (mirrored in api-consumer.yaml).
    Project graph (`006-project-graph`): paths/components below; source  `specs/006-project-graph/contracts/openapi-graph.yaml`.
  version: 1.3.0

servers:
  - url: http://localhost:3000/api/v1
    description: Local development of the backend
  - url: /api/v1
    description: For the reverse proxy (frontend/nginx)

paths:
  /health:
    get:
      summary: Checking the readiness of the service
      operationId: healthCheck
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  elasticsearch:
                    type: string
                    enum: [ok, degraded]

  /projects:
    get:
      summary: List of projects
      operationId: listProjects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      summary: Register the project (+ initial sync)
      operationId: registerProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterProjectRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '200':
          description: Already exists (s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ApiError'

  /projects/{projectId}:
    get:
      summary: Get the project
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/ApiError'
    delete:
      summary: Delete the project (metadata + cascading elements)
      operationId: deleteProject
      description: |
        Hard-delete the project document and all tree elements in Elasticsearch.
        For `git_url`, the work copy directory is deleted from the filesystem backend.
        For `local_path` the original mount is unchanged.
        After you delete the same source , you can register it again (new id).
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '204':
          description: Project deleted (without the body of the answer)
        '404':
          description: not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: sync_in_progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /projects/{projectId}/sync:
    post:
      summary: Run sync
      operationId: syncProject
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '202':
          description: Sync is accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '409':
          description: sync_in_progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'

  /projects/{projectId}/analysis/language-report/latest:
    get:
      summary: Last report from Language Detector
      operationId: getLatestLanguageReport
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageReport'
        '404':
          description: The report is not yet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /projects/{projectId}/analysis/change-set:
    get:
      summary: Changes to files from previous sync
      operationId: getAnalysisChangeSet
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeSet'
        '404':
          $ref: '#/components/responses/ApiError'

  /projects/{projectId}/analysis/runs:
    post:
      summary: Run the analysis
      operationId: startAnalysisRun
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAnalysisRunRequest'
      responses:
        '202':
          description: The propulsion is accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRun'
        '409':
          description: sync or analysis already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      summary: List of analytical prongs
      operationId: listAnalysisRuns
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalysisRun'

  /projects/{projectId}/analysis/runs/{runId}:
    get:
      summary: Status of the analysis
      operationId: getAnalysisRun
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRun'
        '404':
          $ref: '#/components/responses/ApiError'

  /projects/{projectId}/analysis/runs/{runId}/envelopes:
    get:
      summary: Envelope of the results of the drive
      operationId: listParserEnvelopes
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParserEnvelope'

  /projects/{projectId}/elements:
    get:
      summary: The parent_path roots of the folder
      operationId: listChildren
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: parent_path
          in: query
          schema:
            type: string
            default: ""
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildrenPage'
        '400':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'

  /projects/{projectId}/elements/{elementId}:
    get:
      summary: The metadata of the element
      operationId: getElement
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/elementId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Element'
        '404':
          $ref: '#/components/responses/ApiError'
    patch:
      summary: Update the status of the item
      operationId: updateElementStatus
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/elementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/ElementStatus'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Element'
        '404':
          $ref: '#/components/responses/ApiError'

  /projects/{projectId}/elements/{elementId}/content:
    get:
      summary: The contents of the file (read-only)
      operationId: getFileContent
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/elementId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileContent'
        '404':
          $ref: '#/components/responses/ApiError'

  /projects/{projectId}/graph/summary:
    get:
      summary: Summary of the project column (latest run)
      operationId: getGraphSummary
      description: |
        The last chase is from `status` ∈ {success, partial} and `ingest_status` ∈ {success, partial}.
        If there's no column  404 with a clue, run the analysis.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/analysisRunId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphSummary'
        '404':
          description: Count not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /projects/{projectId}/graph/nodes:
    get:
      summary: List of column nodes
      operationId: listGraphNodes
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/analysisRunId'
        - name: path
          in: query
          required: false
          schema:
            type: string
          description: Filter by POSIX path
        - name: kind
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphNodeList'
        '404':
          $ref: '#/components/responses/ApiError'

  /projects/{projectId}/graph/nodes/{nodeId}:
    get:
      summary: The node by id
      operationId: getGraphNode
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/nodeId'
        - $ref: '#/components/parameters/analysisRunId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphNode'
        '404':
          $ref: '#/components/responses/ApiError'

  /projects/{projectId}/graph/nodes/{nodeId}/edges:
    get:
      summary: The edge of the knot (1 hop)
      operationId: listGraphNodeEdges
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/nodeId'
        - $ref: '#/components/parameters/analysisRunId'
        - name: direction
          in: query
          schema:
            type: string
            enum: [outgoing, incoming, both]
            default: both
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphEdgeList'
        '404':
          $ref: '#/components/responses/ApiError'

  /projects/{projectId}/graph/files/{filePath}/dependencies:
    get:
      summary: The nodes and edges of the file
      operationId: getFileGraphDependencies
      description: |
        `filePath`  URL-encoded POSIX path relative to the root of the project
        (for example `src%2Fmain.ts`).
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/filePath'
        - $ref: '#/components/parameters/analysisRunId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileGraphResponse'
        '404':
          description: File or graph not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    elementId:
      name: elementId
      in: path
      required: true
      schema:
        type: string
    runId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    nodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
    filePath:
      name: filePath
      in: path
      required: true
      schema:
        type: string
    analysisRunId:
      name: analysis_run_id
      in: query
      required: false
      schema:
        type: string
        format: uuid

  schemas:
    Project:
      type: object
      required: [id, name, source_type, source_value, sync_status]
      properties:
        id:
          type: string
        name:
          type: string
        source_type:
          type: string
          enum: [git_url, local_path]
        source_value:
          type: string
        sync_status:
          type: string
          enum: [idle, running, success, failed, partial]
        last_sync_at:
          type: string
          format: date-time
          nullable: true
        last_error_message:
          type: string
          nullable: true
        sync_phase:
          type: string
          enum: [refresh_wc, scan, detect, done]
          nullable: true
        sync_files_done:
          type: integer
          nullable: true
        sync_files_total:
          type: integer
          nullable: true
        sync_progress_updated_at:
          type: string
          format: date-time
          nullable: true

    RegisterProjectRequest:
      type: object
      required: [source_type, source_value]
      properties:
        source_type:
          type: string
          enum: [git_url, local_path]
        source_value:
          type: string
        name:
          type: string

    Element:
      type: object
      required: [id, project_id, path, type, status, is_active]
      properties:
        id:
          type: string
        project_id:
          type: string
        path:
          type: string
        parent_path:
          type: string
          nullable: true
        type:
          type: string
          enum: [file, directory]
        status:
          $ref: '#/components/schemas/ElementStatus'
        is_active:
          type: boolean

    ElementStatus:
      type: string
      enum: [auto_found, needed, not_needed, found, unused]

    ChildrenPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Element'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    FileContent:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [text, not_text, error]
        content:
          type: string
        error_code:
          type: string

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    LanguageEntry:
      type: object
      required: [language, file_count, sample_paths, parser_status]
      properties:
        language:
          type: string
        file_count:
          type: integer
        sample_paths:
          type: array
          items:
            type: string
        parser_id:
          type: string
          nullable: true
        parser_status:
          type: string
          enum: [available, missing, failed]

    LanguageReport:
      type: object
      required: [id, project_id, detected_at, languages]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        detected_at:
          type: string
          format: date-time
        languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageEntry'

    ChangeSet:
      type: object
      required: [project_id, incremental, added, modified, deleted]
      properties:
        project_id:
          type: string
          format: uuid
        incremental:
          type: boolean
        added:
          type: array
          items:
            type: string
        modified:
          type: array
          items:
            type: string
        deleted:
          type: array
          items:
            type: string

    StartAnalysisRunRequest:
      type: object
      required: [language_report_id]
      properties:
        language_report_id:
          type: string
          format: uuid
        confirmed_change_set:
          type: boolean
          default: true

    ParserResultSummary:
      type: object
      required: [parser_id, status]
      properties:
        parser_id:
          type: string
        status:
          type: string
          enum: [success, failed, skipped, missing]
        error_message:
          type: string
          nullable: true

    AnalysisRun:
      type: object
      required: [id, project_id, status, started_at, incremental]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        language_report_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, success, partial, failed, cancelled]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        incremental:
          type: boolean
        change_set:
          $ref: '#/components/schemas/ChangeSet'
        parser_results:
          type: array
          items:
            $ref: '#/components/schemas/ParserResultSummary'
        last_error_message:
          type: string
          nullable: true

    ParserEnvelope:
      type: object
      required:
        - parser_id
        - schema_version
        - project_id
        - analysis_run_id
        - generated_at
        - files_analyzed
        - model
      properties:
        parser_id:
          type: string
        schema_version:
          type: string
        project_id:
          type: string
          format: uuid
        analysis_run_id:
          type: string
          format: uuid
        generated_at:
          type: string
          format: date-time
        files_analyzed:
          type: array
          items:
            type: string
        model:
          type: object
          additionalProperties: true

    GraphSummary:
      type: object
      required: [project_id, analysis_run_id, graph_builder, node_count, edge_count]
      properties:
        project_id:
          type: string
          format: uuid
        analysis_run_id:
          type: string
          format: uuid
        graph_builder:
          type: string
          enum: [parsers, ai]
        ingest_status:
          type: string
          enum: [success, partial]
        node_count:
          type: integer
        edge_count:
          type: integer
        languages:
          type: array
          items:
            type: string

    GraphNode:
      type: object
      required: [id, project_id, analysis_run_id, parser_id, kind, name, language, path]
      properties:
        id:
          type: string
        project_id:
          type: string
          format: uuid
        analysis_run_id:
          type: string
          format: uuid
        parser_id:
          type: string
        kind:
          type: string
        name:
          type: string
        qualified_name:
          type: string
        language:
          type: string
        path:
          type: string
        location:
          $ref: '#/components/schemas/GraphLocation'
        element_id:
          type: string
          format: uuid
        parent_id:
          type: string
        signature:
          type: string
        metadata:
          type: object
          additionalProperties: true

    GraphEdge:
      type: object
      required: [id, project_id, analysis_run_id, parser_id, language, from, to, type]
      properties:
        id:
          type: string
        project_id:
          type: string
          format: uuid
        analysis_run_id:
          type: string
          format: uuid
        parser_id:
          type: string
        language:
          type: string
        from:
          type: string
        to:
          type: string
        type:
          type: string
        path:
          type: string
        location:
          $ref: '#/components/schemas/GraphLocation'
        metadata:
          type: object
          additionalProperties: true

    GraphLocation:
      type: object
      properties:
        start_line:
          type: integer
        start_col:
          type: integer
        end_line:
          type: integer
        end_col:
          type: integer

    GraphNodeList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        analysis_run_id:
          type: string
          format: uuid

    GraphEdgeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'
        analysis_run_id:
          type: string
          format: uuid

    FileGraphResponse:
      type: object
      required: [path, nodes, edges]
      properties:
        path:
          type: string
        analysis_run_id:
          type: string
          format: uuid
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'

  responses:
    ApiError:
      description: This is an error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
