openapi: 3.0.3
info:
  title: ODS Backend API — the cut view the graph (011)
  description: |
    Endpoint interactive "Graph view".
    Base graph: `specs/006-project-graph/contracts/openapi-graph.yaml`.
    When implemented — mount next to the existing graph routes.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Local development

paths:
  /projects/{projectId}/graph/view:
    get:
      summary: Cross-section of the scheme (focus + external links)
      operationId: getGraphView
      description: |
        `focus` missing or empty — level "System" (system peer-participants).
        Otherwise— the focus content + simplified external neighbors.
        Priority truncation service → linked information at the root.
        Does not return the full project graph.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: analysis_run_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: focus
          in: query
          required: false
          schema:
            type: string
          description: id Focus node; omit/empty = System
        - name: resolve_from
          in: query
          required: false
          schema:
            type: string
          description: |
            Optional id code/system node from Graph Analysis: server MAY
            resolve to service-focus (011 clarify). If it failed —
            The system + resolve_status.
        - name: max_nodes
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
        - name: max_edges
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        '200':
          description: Slice (including empty system in the presence of code-only graph)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphViewSlice'
        '404':
          description: Graph / project / focus node not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
          description: Russian text for UI

    GraphViewNode:
      type: object
      required: [id, kind, name, role]
      properties:
        id:
          type: string
        kind:
          type: string
        name:
          type: string
        qualified_name:
          type: string
        path:
          type: string
        parent_id:
          type: string
          nullable: true
        language:
          type: string
        metadata:
          type: object
          additionalProperties: true
        role:
          type: string
          enum: [focus, inside, external]
        stub:
          type: boolean
          default: false

    GraphViewEdge:
      type: object
      required: [id, from, to, type]
      properties:
        id:
          type: string
        from:
          type: string
        to:
          type: string
        type:
          type: string
        metadata:
          type: object
          additionalProperties: true

    GraphViewSlice:
      type: object
      required:
        - project_id
        - analysis_run_id
        - focus_id
        - nodes
        - edges
        - truncated
        - limits
      properties:
        project_id:
          type: string
          format: uuid
        analysis_run_id:
          type: string
          format: uuid
        focus_id:
          type: string
          nullable: true
        focus_kind:
          type: string
          nullable: true
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphViewNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphViewEdge'
        truncated:
          type: boolean
        limits:
          type: object
          required: [max_nodes, max_edges]
          properties:
            max_nodes:
              type: integer
            max_edges:
              type: integer
        counts:
          type: object
          properties:
            nodes:
              type: integer
            edges:
              type: integer
            omitted_nodes:
              type: integer
            omitted_edges:
              type: integer
        resolve_status:
          type: string
          enum: [exact, resolved_service, system_fallback, none]
          description: |
            Result resolve_from / direct focus.
            system_fallback — show explanation for UI (code no service).
        empty_reason:
          type: string
          enum: [none, no_system_participants, no_graph]
          description: |
            `no_system_participants` — count is, peer system empty (UI empty state).
            `no_graph` preferably via 404; MAY 200 with this flag is not used.
