openapi: 3.0.3
info:
  title: ODS Backend API — portal scale UX (007)
  description: |
    Extensions over the `002` (elements) and `006` (graph).
    Cascade: `contracts/status-cascade.md`.
    UI: `contracts/graph-ui-scale.md`, `contracts/workspace-panels.md`.
    The way `.../graph/nodes/{nodeId}/...`: in runtime Fastify  wildcard `nodes/*`
    (nodeId contains `/`); nginx transmits the original URI without decoding `%2F`.
    Reserved for future (NOT implemented in 007): query `filter_*` on search
    The server may ignore unknown filter parameters.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Local development

paths:
  /projects/{projectId}/elements/{elementId}:
    patch:
      summary: Changing the status of the element (cascade semantics 007)
      operationId: updateElementStatusCascade
      description: |
        The body is like in OpenAPI `002`. For directory  cascade (except lift from not_needed).
        See also status-cascade.md.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/elementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/ElementStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementWithCascade'
        '404':
          $ref: '#/components/responses/ApiError'
        '422':
          description: cascade_too_large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: cascade_failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /projects/{projectId}/graph/nodes:
    get:
      summary: The list of nodes (parent_id hierarchy)
      operationId: listGraphNodesHierarchical
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/analysisRunId'
        - name: parent_id
          in: query
          required: false
          schema:
            type: string
          description: |
            It 's empty . / `root` — Nodes without a parent (parent_id null).
            Otherwise, they're the direct descendants of this ID.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphNodeList'
        '404':
          $ref: '#/components/responses/ApiError'

  /projects/{projectId}/graph/nodes/{nodeId}/ancestors:
    get:
      summary: The ancestral chain of the node (root → parent)
      operationId: getGraphNodeAncestors
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/nodeId'
        - $ref: '#/components/parameters/analysisRunId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphNodeAncestors'
        '404':
          $ref: '#/components/responses/ApiError'

  /projects/{projectId}/graph/search:
    get:
      summary: Search for nodes and edges (both at once)
      operationId: searchGraph
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/analysisRunId'
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: The search bar (≥2 characters after trim)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: filter_status
          in: query
          required: false
          schema:
            type: string
          description: |
            The server ignores the future faces.
            This parameter is reserved and ignored in `007`.
      responses:
        '200':
          description: OK  always both block nodes and edges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphSearchResult'
        '400':
          description: Too short / empty q
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'

components:
  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    elementId:
      name: elementId
      in: path
      required: true
      schema:
        type: string
    nodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
    analysisRunId:
      name: analysis_run_id
      in: query
      required: false
      schema:
        type: string
        format: uuid

  schemas:
    ElementStatus:
      type: string
      enum: [auto_found, needed, not_needed, found, unused]

    ElementWithCascade:
      type: object
      description: Element 002 + optional cascade statistics
      additionalProperties: true
      properties:
        cascade:
          type: object
          properties:
            updated_count:
              type: integer
              minimum: 1

    GraphNodeList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            description: GraphNode 006; has_children boolean is recommended
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    GraphNodeAncestors:
      type: object
      required: [node_id, ancestors]
      properties:
        node_id:
          type: string
        ancestors:
          type: array
          items:
            type: object
            additionalProperties: true
          description: From the root to the immediate parent

    GraphEdgeList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            description: GraphEdge 006
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    GraphSearchResult:
      type: object
      required: [q, nodes, edges]
      properties:
        q:
          type: string
        nodes:
          $ref: '#/components/schemas/GraphNodeList'
        edges:
          $ref: '#/components/schemas/GraphEdgeList'

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
          description: Localized message text

  responses:
    ApiError:
      description: This is an error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
